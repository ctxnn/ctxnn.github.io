<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>This site has a new home — Chirag Taneja</title>
  <meta name="theme-color" content="#f4f0e8">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #f4f0e8;
      color: #46423b;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121210; color: #cbc6bc; }
      .card { border-color: rgba(235,231,222,.14); background: #191815; }
      .muted { color: #9a958b; }
      .eyebrow { color: #aab8aa; }
      h1 { color: #ebe7de; }
      .contact a { background: #1d1c19; border-color: rgba(235,231,222,.18); color: #ebe7de; }
      .contact a:hover { border-color: #aab8aa; color: #aab8aa; }
    }
    .card {
      width: min(100%, 440px);
      padding: 28px 26px 24px;
      border: 1px solid rgba(48,44,38,.14);
      background: #f8f5ef;
      box-shadow: 0 1px 0 rgba(64,53,42,.08);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #627366;
      font: 0.68rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      color: #24211d;
      font: 400 1.55rem/1.2 Georgia, "Times New Roman", serif;
      letter-spacing: -0.03em;
    }
    p { margin: 0 0 1em; }
    .muted { color: #6f6a61; font-size: .92rem; }
    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 4px 0 0;
    }
    .contact a {
      display: inline-flex;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid rgba(48,44,38,.19);
      background: #fff;
      color: #24211d;
      font: 0.78rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .03em;
      text-decoration: none;
    }
    .contact a:hover { border-color: #627366; color: #627366; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">notice</p>
    <h1>This site has a new home</h1>
    <p>The site that used to live here has moved.</p>
    <p class="muted">If you need to reach me:</p>
    <p class="contact">
      <a href="https://x.com/ctxnn1" target="_blank" rel="me noreferrer">@ctxnn1</a>
      <a href="mailto:chiragtaneja.work@gmail.com">chiragtaneja.work@gmail.com</a>
    </p>
  </main>
</body>
</html>
